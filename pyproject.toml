[project]
name = "ar4-twin-tools"
version = "0.1.0"
description = "Checks for the AR4 digital twin project: an MCP call logger and the Newton harness checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sim = ["newton[sim]==1.7.0", "warp-lang==1.18.0", "numpy"]

[project.scripts]
twin-mcp-log = "twin_tools.mcp_log:main"
twin-check = "twin_tools.check:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
