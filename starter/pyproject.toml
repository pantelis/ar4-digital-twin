[project]
name = "twin-agent"
version = "0.1.0"
description = "Starter for your AR4 twin agent: Pydantic AI plumbing for reading the documents and driving FreeCAD, no extraction"
requires-python = ">=3.11"
dependencies = [
    "ar4-twin-tools",
    "kdb-tools[agent]",
    "pydantic-ai-slim[openai,mcp]==2.58.0",
]

[project.scripts]
twin = "twinagent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "pypdf>=5", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinagent"]

[tool.uv.sources]
ar4-twin-tools = { git = "https://github.com/pantelis/ar4-digital-twin" }
kdb-tools = { git = "https://github.com/aegean-ai/kdb-tools", tag = "v0.4.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
