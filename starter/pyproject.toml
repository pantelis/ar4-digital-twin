[project]
name = "twin-agent"
version = "0.1.0"
description = "Starter for your AR4 twin agent: Pydantic AI plumbing for reading the documents and driving FreeCAD, no extraction"
requires-python = ">=3.11"
dependencies = [
    "ar4-twin-tools",
    "kdb-tools[agent]",
    "pydantic-ai-slim[openai,mcp]==2.58.0",
]

[project.scripts]
twin = "twinagent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "pypdf>=5", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinagent"]

[tool.uv.sources]
# The course tools this starter must track: the student repository's main branch (the twin-check trace binding,
# the grading rules) and the kdb-tools release the course pins (v0.5.1, as in ../pyproject.toml). Relock after
# either moves: uv lock --upgrade-package ar4-twin-tools --upgrade-package kdb-tools
ar4-twin-tools = { git = "https://github.com/pantelis/ar4-digital-twin", branch = "main" }
kdb-tools = { git = "https://github.com/aegean-ai/kdb-tools", tag = "v0.5.1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
