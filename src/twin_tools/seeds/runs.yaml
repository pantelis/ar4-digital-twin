# Seed for the runs ontology: the classes every team's kDB shares for runs and their results.
domain: runs
title: Runs
description: 'Classes for the runs of a pick-and-place project: tasks, actions, trainings, policies, evaluations,
  episodes and metrics.'
base_iri: https://kdb.aegean.ai/ar4/runs/
extends:
- core
properties:
- slug: achieves
  title: Achieves
  datatype: iri
  scope: The action or task a run or a policy sets out to achieve.
  close_match:
  - http://www.w3.org/ns/mls#achieves
- slug: implementation
  title: Implementation
  datatype: iri
  scope: The implementation that carried out the run.
  close_match:
  - http://www.w3.org/ns/mls#executes
  - http://www.w3.org/ns/prov#wasAssociatedWith
- slug: algorithm
  title: Algorithm
  datatype: iri
  scope: The algorithm a training run realizes.
  close_match:
  - http://www.w3.org/ns/mls#realizes
- slug: inputs
  title: Inputs
  datatype: iri_list
  scope: 'The things a run used: design snapshots, trainer configurations, objects and policies.'
  close_match:
  - http://www.w3.org/ns/mls#hasInput
  - http://www.w3.org/ns/prov#used
- slug: outputs
  title: Outputs
  datatype: iri_list
  scope: The things a run produced, such as its policy.
  close_match:
  - http://www.w3.org/ns/mls#hasOutput
- slug: generated_by
  title: Generated by
  datatype: iri
  scope: The training run that produced the policy.
  close_match:
  - http://www.w3.org/ns/prov#wasGeneratedBy
- slug: started
  title: Started
  datatype: timestamp
  scope: When the run started.
  close_match:
  - http://www.w3.org/ns/prov#startedAtTime
- slug: ended
  title: Ended
  datatype: timestamp
  scope: When the run ended.
  close_match:
  - http://www.w3.org/ns/prov#endedAtTime
- slug: judged_by
  title: Judged by
  datatype: iri
  scope: The implementation that judged the evaluation.
  close_match:
  - http://www.w3.org/ns/prov#wasAttributedTo
- slug: skill
  title: Skill
  datatype: string
  scope: The name of the skill the policy performs, such as pick or place.
- slug: weights
  title: Weights
  datatype: media_ref_list
  scope: The stored file that holds the policy, a TorchScript module.
- slug: spec
  title: Specification
  datatype: iri
  scope: The evaluation specification an evaluation follows.
  close_match:
  - http://www.w3.org/ns/mls#specifiedBy
- slug: seed
  title: Seed
  datatype: integer
  scope: The random seed that fixed the placements.
- slug: episodes
  title: Episodes
  datatype: integer
  scope: The number of episodes in the evaluation.
- slug: success_rate
  title: Success rate
  datatype: double
  scope: The fraction of episodes whose verdict is success.
  close_match:
  - http://www.w3.org/ns/mls#hasValue
- slug: clean_success_rate
  title: Clean success rate
  datatype: double
  scope: The fraction of episodes that succeeded with no speed or collision flag.
  close_match:
  - http://www.w3.org/ns/mls#hasValue
- slug: pick_success
  title: Pick success
  datatype: double
  scope: The fraction of episodes in which the cube was picked.
  close_match:
  - http://www.w3.org/ns/mls#hasValue
- slug: failures
  title: Failures
  datatype: json
  scope: The fraction of episodes for each kind of failure.
- slug: trace
  title: Trace
  datatype: media_ref_list
  scope: The stored files that hold the logged state of the episodes.
- slug: explanation
  title: Explanation
  datatype: string
  scope: A plain account of the result, written for a reader.
- slug: evaluation
  title: Evaluation
  datatype: iri
  scope: The evaluation an episode belongs to.
  close_match:
  - http://www.w3.org/ns/prov#wasInfluencedBy
- slug: episode-index
  title: Episode index
  datatype: integer
  scope: The position of the episode within its evaluation, counting from zero.
- slug: cube_x
  title: Cube x
  datatype: double
  scope: The x position of the cube at the start, in metres.
- slug: cube_y
  title: Cube y
  datatype: double
  scope: The y position of the cube at the start, in metres.
- slug: cube_yaw
  title: Cube yaw
  datatype: double
  scope: The yaw of the cube at the start, in radians.
- slug: box_x
  title: Box x
  datatype: double
  scope: The x position of the box, in metres.
- slug: box_y
  title: Box y
  datatype: double
  scope: The y position of the box, in metres.
- slug: verdict
  title: Verdict
  datatype: boolean
  scope: Whether the judge found the episode a success, from the logged state.
- slug: failure
  title: Failure
  datatype: string
  scope: The kind of failure the judge found, or empty on success.
- slug: executor_outcome
  title: Executor outcome
  datatype: string
  scope: What the executor reported. It is stored for comparison and never decides the verdict.
- slug: pick_steps
  title: Pick steps
  datatype: integer
  scope: The control steps the pick skill ran.
- slug: place_steps
  title: Place steps
  datatype: integer
  scope: The control steps the place skill ran.
- slug: speed_flag
  title: Speed flag
  datatype: boolean
  scope: Whether an arm joint exceeded its velocity limit by the allowed margin for too long.
- slug: collision_flag
  title: Collision flag
  datatype: boolean
  scope: Whether two non-adjacent arm links interpenetrated by more than the allowed depth.
- slug: handover
  title: Handover
  datatype: json
  scope: 'The state at the end of the pick: joint positions, jaw opening and the cube pose in the grasp
    frame.'
- slug: run
  title: Run
  datatype: iri
  scope: The run a metric belongs to.
  close_match:
  - http://www.w3.org/ns/prov#wasInfluencedBy
- slug: name
  title: Name
  datatype: string
  scope: The name of the metric.
- slug: step
  title: Step
  datatype: integer
  scope: The training step at which the metric was logged.
- slug: value
  title: Value
  datatype: double
  scope: The value of the metric.
  close_match:
  - http://www.w3.org/ns/mls#hasValue
classes:
- slug: task
  title: Task
  scope: 'A planning task: a PDDL problem and its goal. It links its actions, its objects and its evaluation
    specification.'
  close_match:
  - http://www.w3.org/ns/mls#Task
- slug: action
  title: Action
  scope: One PDDL action of a task. It links the predicates in its precondition and effect.
  close_match:
  - http://www.w3.org/ns/mls#Task
- slug: predicate
  title: Predicate
  scope: A test on simulator state, such as holding. Its tolerances are quantities.
  close_match:
  - http://www.w3.org/ns/mls#EvaluationProcedure
- slug: task-object
  title: Task object
  scope: An object the task manipulates, such as the cube or the box, with its size, mass and friction.
  close_match:
  - http://www.w3.org/ns/mls#Data
- slug: evaluation-spec
  title: Evaluation specification
  scope: The episode count, the seeds, the placement ranges and the measures an evaluation reports.
  close_match:
  - http://www.w3.org/ns/mls#EvaluationSpecification
  - http://www.w3.org/ns/prov#Plan
- slug: algorithm
  title: Algorithm
  scope: A learning algorithm, such as PPO, cited to its paper.
  close_match:
  - http://www.w3.org/ns/mls#Algorithm
- slug: implementation
  title: Implementation
  scope: Software that carries out an algorithm or a procedure, such as the trainer, the executor or the
    judge, with its version.
  close_match:
  - http://www.w3.org/ns/mls#Implementation
  - http://www.w3.org/ns/prov#SoftwareAgent
- slug: trainer-config
  title: Trainer configuration
  scope: The fixed settings of one training setup, as quantities.
  close_match:
  - http://www.w3.org/ns/mls#HyperParameterSetting
  - http://www.w3.org/ns/prov#Plan
- slug: design-snapshot
  title: Design snapshot
  scope: The hashes of the design quantities and of the CAD document at one moment. Each page it covers
    is a member.
  close_match:
  - http://www.w3.org/ns/mls#Data
  - http://www.w3.org/ns/prov#Collection
- slug: training-run
  title: Training run
  scope: One training run of one action.
  close_match:
  - http://www.w3.org/ns/mls#Run
  - http://www.w3.org/ns/prov#Activity
- slug: policy
  title: Policy
  scope: The checkpoint a training run produced, stored as a TorchScript file.
  close_match:
  - http://www.w3.org/ns/mls#Model
  - http://www.w3.org/ns/prov#Entity
- slug: evaluation
  title: Evaluation
  scope: One judged evaluation round. Its result numbers are model evaluations.
  close_match:
  - http://www.w3.org/ns/mls#Run
  - http://www.w3.org/ns/prov#Activity
- slug: episode
  title: Episode
  scope: One simulated attempt inside an evaluation, with its placement, its verdict and its flags.
  close_match:
  - http://www.w3.org/ns/prov#Activity
- slug: metric
  title: Metric
  scope: One training or evaluation metric value at one step.
  close_match:
  - http://www.w3.org/ns/mls#ModelEvaluation
